<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flip Card - Giới thiệu bản thân</title>
    <link rel="stylesheet" href="card.css">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: var(--bg-page);
        }
        
        /* 1. Container chính */
        .flip-card-container {
            width: 300px;
            height: 400px;
            perspective: 1000px; /* Tạo chiều sâu 3D */
        }
        
        /* 2. Phần tử bao bọc 2 mặt thẻ */
        .flip-card-inner {
            width: 100%;
            height: 100%;
            position: relative;
            transition: transform 0.6s ease-in-out; /* Hiệu ứng mượt mà */
            transform-style: preserve-3d; /* Giữ các mặt con trong không gian 3D */
            box-shadow: var(--card-shadow);
            border-radius: 16px;
        }
        
        /* Khi hover vào container, xoay mặt trong 180 độ theo trục Y */
        .flip-card-container:hover .flip-card-inner {
            transform: rotateY(180deg);
        }
        
        /* 3. Khai báo thuộc tính chung cho 2 mặt */
        .card-front, .card-back {
            width: 100%;
            height: 100%;
            position: absolute;
            backface-visibility: hidden; /* Ẩn mặt sau khi thẻ lật */
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 24px;
            border: 1px solid var(--cyan-border);
        }
        
        /* Mặt trước */
        .card-front {
            background-color: var(--bg-card);
            color: var(--cyan-dark);
        }
        
        .card-front img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 16px;
            border: 4px solid var(--cyan-light);
        }
        
        .card-front h2 {
            font-size: 22px;
            margin-bottom: 8px;
        }
        
        .card-front p {
            color: var(--text-sub);
            font-size: 15px;
        }
        
        /* Mặt sau */
        .card-back {
            background: linear-gradient(135deg, var(--cyan-primary), var(--cyan-dark));
            color: white;
            transform: rotateY(180deg); /* Xoay mặt sau 180 độ từ đầu */
            border: none;
        }
        
        .card-back h3 {
            font-size: 20px;
            margin-bottom: 24px;
        }
        
        .social-links {
            display: flex;
            gap: 16px;
        }
        
        .social-links a {
            color: white;
            background-color: rgba(255, 255, 255, 0.2);
            width: 48px;
            height: 48px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            text-decoration: none;
            transition: background-color 0.3s;
        }
        
        .social-links a:hover {
            background-color: rgba(255, 255, 255, 0.4);
        }
    </style>
</head>
<body>

    <div class="flip-card-container">
        <div class="flip-card-inner">
            <!-- Mặt trước thẻ -->
            <div class="card-front">
                <!-- Sử dụng ảnh placeholder làm ảnh đại diện -->
                <img src="https://ui-avatars.com/api/?name=Sinh+Vien&background=06b6d4&color=fff&size=120" alt="Avatar">
                <h2>Sinh Viên</h2>
                <p>Web Developer</p>
            </div>
            
            <!-- Mặt sau thẻ -->
            <div class="card-back">
                <h3>Kết nối với tôi</h3>
                <div class="social-links">
                    <!-- Facebook Icon -->
                    <a href="https://facebook.com" target="_blank" title="Facebook">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"></path>
                        </svg>
                    </a>
                    <!-- GitHub Icon -->
                    <a href="https://github.com" target="_blank" title="GitHub">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"></path>
                        </svg>
                    </a>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
